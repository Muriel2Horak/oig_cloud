# Local SonarQube (P0) settings. Run: sonar-scanner -Dproject.settings=.sonar/local.properties
# Host URL and token come from SONAR_HOST_URL / SONAR_TOKEN env, never from this file.
sonar.projectKey=local:oig-cloud
sonar.projectName=local:oig-cloud
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Source/test split (playwright e2e specs added as tests after review; post-scan refinement): files matching sonar.test.inclusions are tests, the rest of the roots are main code.
sonar.sources=custom_components,scripts
sonar.tests=tests,custom_components/oig_cloud/www_v2/tests,custom_components/oig_cloud/www_v2/src,custom_components/oig_cloud/www_v2/playwright
sonar.test.inclusions=tests/**,custom_components/oig_cloud/www_v2/playwright/**,custom_components/oig_cloud/www_v2/tests/**,custom_components/oig_cloud/www_v2/src/**/__tests__/**,custom_components/oig_cloud/www_v2/src/**/*.test.ts,custom_components/oig_cloud/www_v2/src/**/*.test.tsx

# Exclusions: ONLY generated / vendored / bundled / fixture / data paths.
# bundled: Vite build output (minified bundles + sourcemaps + built index.html) of www_v2, regenerated by build-v2.mjs
sonar.exclusions=custom_components/oig_cloud/www_v2/dist/**
