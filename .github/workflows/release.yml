name: Create Release

on:
  workflow_dispatch:
    inputs:
      create-tag:
        description: 'Create tag'
        required: true
        default: 'false'
      bypass-required-checks:
        description: 'Override: release even if required CI checks are failing or have not run (recorded in the run)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  gate:
    name: CI Gate (required checks on the sha being released)
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      report: ${{ steps.gate.outputs.report }}
    steps:
      - name: Evaluate required CI checks for ${{ github.sha }}
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BYPASS: ${{ inputs.bypass-required-checks }}
          ACTOR: ${{ github.actor }}
          REQUIRED_WORKFLOWS: test.yml quality.yml security.yml sonarcloud.yml secret-scanning.yml pre-commit.yml
        run: |
          set -euo pipefail
          : "${REPO:?REPO must name the repository to inspect}"
          : "${SHA:?SHA must name the commit to inspect}"
          : "${GITHUB_STEP_SUMMARY:?GITHUB_STEP_SUMMARY must name the summary file}"
          : "${GITHUB_OUTPUT:?GITHUB_OUTPUT must name the output file}"
          BYPASS="${BYPASS:-false}"
          ACTOR="${ACTOR:-unknown}"
          REQUIRED_WORKFLOWS="${REQUIRED_WORKFLOWS:-test.yml quality.yml security.yml sonarcloud.yml secret-scanning.yml pre-commit.yml}"

          # Required workflows already run for github.sha. Wait for an in-flight
          # run to finish so a newer rerun cannot be masked by an older result.
          MAX_POLLS="${RELEASE_GATE_MAX_POLLS:-40}"
          POLL_SECONDS="${RELEASE_GATE_POLL_SECONDS:-15}"
          verdict="pass"

          : > "$GITHUB_STEP_SUMMARY"
          {
            printf '## CI Gate - required checks for %.12s\n\n' "$SHA"
            printf '| Workflow | Run | Attempt | Conclusion |\n'
            printf '|---|---:|---:|---|\n'
          } >> "$GITHUB_STEP_SUMMARY"

          for workflow in $REQUIRED_WORKFLOWS; do
            latest=""
            pending=1
            poll=0

            while :; do
              # Keep all attempts and statuses. Latest-wins is correct because GitHub
              # reruns supersede an earlier attempt for the same workflow and SHA; the
              # cost is that an older failure is intentionally hidden by the rerun's
              # conclusion, so the gate depends on GitHub's attempt metadata being right.
              runs="$(gh api --paginate --slurp -H 'Accept: application/vnd.github+json' \
                "repos/${REPO}/actions/workflows/${workflow}/runs?head_sha=${SHA}&per_page=100")"

              pending="$(jq --arg sha "$SHA" \
                '[.[].workflow_runs[] | select(.head_sha == $sha and .status != "completed")] | length' \
                <<< "$runs")"
              latest="$(jq -r --arg sha "$SHA" '
                [.[].workflow_runs[]
                 | select(.head_sha == $sha and .status == "completed")]
                | max_by([(.run_attempt // 1), .created_at])
                | if . == null then ""
                  else [.id, (.run_attempt // 1), (.conclusion // "unknown"), .created_at, .head_sha] | @tsv
                  end
              ' <<< "$runs")"

              if [ "$pending" -eq 0 ]; then
                break
              fi
              if [ "$poll" -ge "$MAX_POLLS" ]; then
                break
              fi
              poll=$((poll + 1))
              if [ "$POLL_SECONDS" -gt 0 ]; then
                sleep "$POLL_SECONDS"
              fi
            done

            if [ -z "$latest" ]; then
              printf '| `%s` | - | - | **BLOCK: no completed run** |\n' "$workflow" >> "$GITHUB_STEP_SUMMARY"
              verdict="block"
              continue
            fi

            IFS=$'\t' read -r run_id attempt conclusion created_at run_sha <<< "$latest"
            if [ "$run_sha" != "$SHA" ]; then
              printf '| `%s` | %s | %s | **BLOCK: SHA mismatch** |\n' "$workflow" "$run_id" "$attempt" >> "$GITHUB_STEP_SUMMARY"
              verdict="block"
            elif [ "$conclusion" != "success" ]; then
              printf '| `%s` | %s | %s | **BLOCK: %s** |\n' "$workflow" "$run_id" "$attempt" "$conclusion" >> "$GITHUB_STEP_SUMMARY"
              verdict="block"
            else
              printf '| `%s` | %s | %s | success |\n' "$workflow" "$run_id" "$attempt" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$BYPASS" = "true" ]; then
            {
              printf '\n**OVERRIDE**: `bypass-required-checks` was set to true by `%s`. Release proceeds despite gate verdict: `%s`.\n' "$ACTOR" "$verdict"
              printf 'This is the audit record for the explicit override.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            printf 'decision=override\n' >> "$GITHUB_OUTPUT"
            printf 'report=CI gate %s; OVERRIDE by %s\n' "$verdict" "$ACTOR" >> "$GITHUB_OUTPUT"
          else
            printf 'decision=%s\n' "$verdict" >> "$GITHUB_OUTPUT"
            printf 'report=CI gate %s\n' "$verdict" >> "$GITHUB_OUTPUT"
            if [ "$verdict" = "block" ]; then
              printf '\nRefusing to release: required checks are failing or absent for %.12s.\n' "$SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Gate verdict
        run: echo "${{ steps.gate.outputs.report }}"

  release:
    needs: gate
    if: ${{ needs.gate.outputs.decision == 'pass' || needs.gate.outputs.decision == 'override' }}
    runs-on: ubuntu-latest

    steps:
      # No release commit is created here. The tag is always made from the
      # exact SHA evaluated by gate; bypass remains the explicit audited escape hatch.
      - name: Checkout the gated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Derive release version from the gated commit
        id: version
        run: |
          VERSION="$(jq -er '.version | strings' custom_components/oig_cloud/manifest.json)"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version in gated manifest: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: ${{ github.event.inputs.create-tag == 'true' }}
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            echo "Checkout is not the gated release commit"
            exit 1
          fi
          git tag -a "v${{ steps.version.outputs.version }}" -m "Version ${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        if: ${{ github.event.inputs.create-tag == 'true' }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            {
              echo "notes<<EOF"
              echo "Release ${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]" { exit }
            in_section { print }
          ' CHANGELOG.md)"

          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: actions/create-release@v1
        if: ${{ github.event.inputs.create-tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
