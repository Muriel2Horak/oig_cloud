name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
      create-tag:
        description: 'Create tag'
        required: true
        default: 'false'
      bypass-required-checks:
        description: 'Override: release even if required CI checks are failing or have not run (recorded in the run)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  gate:
    name: CI Gate (required checks on the sha being released)
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      report: ${{ steps.gate.outputs.report }}
    steps:
      - name: Evaluate required CI checks for ${{ github.sha }}
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BYPASS: ${{ inputs.bypass-required-checks }}
        run: |
          set -eu
          # Workflows that must be green on the exact commit being released.
          # Rationale (see CI_CD.md): test = pytest suite; quality = flake8/Pylint/Mypy + frontend lint;
          # security = CodeQL/Bandit/Safety; sonarcloud = quality gate + coverage.
          # Excluded: maintainability (Radon/Vulture advisory report), secret-scanning (Snyk is
          # continue-on-error by design, and CodeQL runs in security.yml), pre-commit (local lint
          # discipline, duplicated by quality.yml in CI).
          REQUIRED="test.yml quality.yml security.yml sonarcloud.yml"
          verdict="pass"
          : > "$GITHUB_STEP_SUMMARY"
          echo "## CI Gate — required checks for ${SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | Run | Conclusion |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for wf in $REQUIRED; do
            # headSha filter guarantees we judge THIS commit, not "latest run on main"
            runs=$(gh api --paginate -H "Accept: application/vnd.github+json" \
              "repos/${REPO}/actions/workflows/${wf}/runs?head_sha=${SHA}&status=completed" \
              --jq '.workflow_runs[].conclusion' || echo "")
            n=$(printf '%s' "$runs" | grep -c . || true)
            if [ "$n" -eq 0 ]; then
              echo "| ${wf} | — (no completed run) | **BLOCK: not run** |" >> "$GITHUB_STEP_SUMMARY"
              verdict="block"
            elif printf '%s' "$runs" | grep -qv '^success$'; then
              echo "| ${wf} | ${n} run(s) | **BLOCK: $(printf '%s' "$runs" | grep -v '^success$' | head -1)** |" >> "$GITHUB_STEP_SUMMARY"
              verdict="block"
            else
              echo "| ${wf} | ${n} run(s) | success |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ "$BYPASS" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ **OVERRIDE**: \`bypass-required-checks\` was set to true by ${{ github.actor }}. Release proceeds despite gate verdict: ${verdict}. This line is the audit record." >> "$GITHUB_STEP_SUMMARY"
            echo "decision=override" >> "$GITHUB_OUTPUT"
            echo "report=CI gate ${verdict}; OVERRIDE by ${{ github.actor }}" >> "$GITHUB_OUTPUT"
          else
            echo "decision=${verdict}" >> "$GITHUB_OUTPUT"
            echo "report=CI gate ${verdict}" >> "$GITHUB_OUTPUT"
            if [ "$verdict" = "block" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "Refusing to release: required checks are failing or absent for ${SHA:0:12}. Fix them, or re-run the release with the documented override input \`bypass-required-checks\`." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Gate verdict
        run: echo "${{ steps.gate.outputs.report }}"

  release:
    needs: gate
    if: ${{ needs.gate.outputs.decision == 'pass' || needs.gate.outputs.decision == 'override' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version input
        id: validate_version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ "$VERSION" != "dev" ] && ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Replace version and service in release_const.py
        working-directory: ./custom_components/oig_cloud
        run: |
          VERSION="${{ steps.validate_version.outputs.version }}"
          echo "COMPONENT_VERSION = \"$VERSION\"" > release_const.py
          if [ "$VERSION" == "dev" ]; then
            echo 'SERVICE_NAME = "oig_cloud_dev"' >> release_const.py
          else
            echo 'SERVICE_NAME = "oig_cloud"' >> release_const.py
          fi

      - name: Update version property in manifest.json
        working-directory: ./custom_components/oig_cloud
        run: |
          VERSION="${{ steps.validate_version.outputs.version }}"
          if [ "$VERSION" == "dev" ]; then
            jq --arg version '0.0.0' '.version = $version' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          else
            jq --arg version "$VERSION" '.version = $version' manifest.json > manifest.tmp && mv manifest.tmp manifest.json
          fi


      - name: Commit changes
        working-directory: ./custom_components/oig_cloud
        run: |
          git config --global user.name "Pavel Simsa"
          git config --global user.email "pavel@simsa.cz"
          git add release_const.py manifest.json
          git commit -m "Setting release variables to ${{ steps.validate_version.outputs.version }}"

      - name: Push changes
        working-directory: ./custom_components/oig_cloud
        if: ${{ github.event.inputs.create-tag != 'true' }}
        run: |
          git push

      - name: Create tag
        if: ${{ github.event.inputs.create-tag == 'true' }}
        working-directory: ./custom_components/oig_cloud
        run: |
          git tag -a v${{ steps.validate_version.outputs.version }} -m "Version ${{ steps.validate_version.outputs.version }}"
          git push --tags

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        if: ${{ github.event.inputs.create-tag == 'true' }}
        run: |
          VERSION="${{ steps.validate_version.outputs.version }}"
          if [ ! -f CHANGELOG.md ]; then
            {
              echo "notes<<EOF"
              echo "Release ${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOTES="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { in_section=1 }
            in_section && $0 ~ "^## \\[" && $0 !~ "^## \\[" ver "\\]" { exit }
            in_section { print }
          ' CHANGELOG.md)"

          if [ -z "$NOTES" ]; then
            NOTES="Release ${VERSION}"
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: actions/create-release@v1
        if: ${{ github.event.inputs.create-tag == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.validate_version.outputs.version }}
          release_name: Release ${{ steps.validate_version.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: true
