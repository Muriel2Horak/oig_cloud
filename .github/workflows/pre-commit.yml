name: Pre-commit

on:
  push:
    branches:
      - main
      - temp
  pull_request:

jobs:
  pre-commit-check:
    name: Pre-commit Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: custom_components/oig_cloud/www_v2/package-lock.json

      - name: Install hash-locked Python dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Install exact v2 dependencies
        working-directory: custom_components/oig_cloud/www_v2
        run: npm ci --ignore-scripts

      - name: Run pre-commit
        env:
          PYLINT_REPORT: pylint-report.json
        run: |
          python -m pre_commit run --all-files --show-diff-on-failure

      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint-report.json
          if-no-files-found: error
