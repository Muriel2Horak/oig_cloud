name: Dependency Check

on:
  push:
    branches:
      - main
      - temp
  pull_request:

jobs:
  pytest-check:
    name: Pytest Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip check

      - name: Verify reproducible dependency locks
        run: |
          test "$(uv --version | cut -d ' ' -f 1-2)" = "uv 0.11.31"
          ./scripts/generate_requirements.sh --check

      - name: Run pytest
        run: |
          pytest -v --tb=short
